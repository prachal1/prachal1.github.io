<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clari Updater</title>
<style>
  :root {
    --brand-ink: #152450;
    --brand-white: #FFFFFF;
    --brand-cream: #F9F8F5;
    --brand-neutral-light: #F1EFEA;
    --brand-accent: #FF451A;
    --brand-blue: #2243A2;
    --brand-blue-light: #B1CADA;

    --bg: var(--brand-cream);
    --text: var(--brand-ink);
    --card-bg: var(--brand-white);
    --field-bg: var(--brand-neutral-light);
    --sub-text: var(--brand-blue);
  }

  [data-theme="dark"] {
    --bg: #0E1730;
    --text: #F1EFEA;
    --card-bg: #16224A;
    --field-bg: #1E2C58;
    --sub-text: var(--brand-blue-light);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Roboto', Inter, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 60px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  .logo {
    display: block;
    height: 32px;
  }

  h1 {
    font-family: 'Roboto Medium', Roboto, Inter, sans-serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 4px;
  }

  .sub {
    color: var(--sub-text);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 28px 28px 8px;
    margin-bottom: 20px;
    transition: background 0.2s ease;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand-accent);
    font-weight: 600;
    margin-bottom: 12px;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }

  input[type="text"],
  input[type="date"],
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: var(--field-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    transition: background 0.2s ease, color 0.2s ease;
  }

  textarea {
    min-height: 64px;
  }

  input:focus, textarea:focus {
    outline: 2px solid var(--brand-blue-light);
  }

  .row {
    display: flex;
    gap: 16px;
  }

  .row .field {
    flex: 1;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .toggle-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--brand-accent);
  }

  .toggle-row label {
    margin: 0;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin: 8px 0 32px;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--brand-accent);
    color: var(--brand-white);
  }

  .btn-secondary {
    background: var(--field-bg);
    color: var(--text);
  }

  .btn-primary:hover { background: #e13c14; }
  .btn-secondary:hover { filter: brightness(0.95); }

  #output {
    width: 100%;
    min-height: 220px;
    background: var(--field-bg);
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-family: 'Roboto Mono', Menlo, monospace;
    font-size: 13.5px;
    color: var(--text);
    white-space: pre-wrap;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .copied {
    color: var(--sub-text);
    font-size: 13px;
    margin-top: 8px;
    height: 16px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--field-bg);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <img class="logo" id="logo" src="https://prachal1.github.io/genesys_logo.png" alt="Genesys">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark mode</button>
  </div>
  <h1>Clari updater</h1>
  <p class="sub">Fill in the fields below, then copy the formatted output.</p>

  <div class="card">
    <div class="eyebrow">Note</div>

    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label for="t">T</label>
      <textarea id="t"></textarea>
    </div>

    <div class="field">
      <label for="u">U</label>
      <textarea id="u"></textarea>
    </div>

    <div class="field">
      <label for="r">R</label>
      <textarea id="r"></textarea>
    </div>

    <div class="field">
      <label for="n">N</label>
      <textarea id="n"></textarea>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">Forecast</div>

    <div class="row">
      <div class="field">
        <label for="locMonth">LOC in-month</label>
        <input type="text" id="locMonth" placeholder="%">
      </div>
      <div class="field">
        <label for="locQuarter">LOC in quarter</label>
        <input type="text" id="locQuarter" placeholder="%">
      </div>
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="alp">
      <label for="alp">ALP</label>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">Formatted output</div>
    <div id="output"></div>
    <div class="copied" id="copiedMsg"></div>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="copyOutput()">Copy</button>
    <button class="btn-secondary" onclick="clearAll()">Clear</button>
  </div>
</div>

<script>
  const ids = ['date','t','u','r','n','locMonth','locQuarter','alp'];

  function formatDate(value) {
    if (!value) return '';
    const [y, m, d] = value.split('-');
    return `${m}/${d}/${y}`;
  }

  function buildOutput() {
    const date = formatDate(document.getElementById('date').value);
    const t = document.getElementById('t').value.trim();
    const u = document.getElementById('u').value.trim();
    const r = document.getElementById('r').value.trim();
    const n = document.getElementById('n').value.trim();
    const locMonth = document.getElementById('locMonth').value.trim();
    const locQuarter = document.getElementById('locQuarter').value.trim();
    const alp = document.getElementById('alp').checked ? 'Yes' : 'No';

    const text =
`Date: ${date}
T: ${t}
U: ${u}
R: ${r}
N: ${n}

LOC in-month: ${locMonth}
LOC in quarter: ${locQuarter}
ALP: ${alp}`;

    document.getElementById('output').textContent = text;
  }

  function copyOutput() {
    const text = document.getElementById('output').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const msg = document.getElementById('copiedMsg');
      msg.textContent = 'Copied to clipboard';
      setTimeout(() => { msg.textContent = ''; }, 2000);
    });
  }

  function clearAll() {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el.type === 'checkbox') {
        el.checked = false;
      } else {
        el.value = '';
      }
    });
    buildOutput();
  }

  ids.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', buildOutput);
    el.addEventListener('change', buildOutput);
  });

  buildOutput();

  const LOGO_LIGHT = 'https://prachal1.github.io/genesys_logo.png';
  const LOGO_DARK = 'https://prachal1.github.io/genesys_logo_white.png';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const toggle = document.getElementById('themeToggle');
    const logo = document.getElementById('logo');
    if (theme === 'dark') {
      toggle.textContent = '☀️ Light mode';
      logo.src = LOGO_DARK;
    } else {
      toggle.textContent = '🌙 Dark mode';
      logo.src = LOGO_LIGHT;
    }
    localStorage.setItem('clariTheme', theme);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  const saved = localStorage.getItem('clariTheme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
</script>
</body>
</html>
